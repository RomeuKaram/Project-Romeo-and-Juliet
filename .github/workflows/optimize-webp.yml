name: Otimizar imagens para WebP

on:
  push:
    paths:
      - "tools/convert_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Converter imagens e atualizar caminhos
        run: python tools/convert_images.py
      - name: Salvar imagens WebP no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images js/app.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Otimiza imagens do álbum para WebP"
            git push
          fi
